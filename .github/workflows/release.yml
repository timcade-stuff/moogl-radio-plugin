name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to
# build the plugin and publish MooglRadio.zip to a GitHub Release.
# repo.json's DownloadLink* fields point at releases/latest/download/MooglRadio.zip,
# so this is what makes the custom Dalamud repo stay up to date automatically.
#
# Verified 2026-07-25: builds green end-to-end against Dalamud API level 13.
# Note DalamudPackager names its output latest.zip (not <AssemblyName>.zip),
# nested under bin/Release/MooglRadio/ — the locate step below renames it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Dalamud.NET.Sdk builds against Dalamud's own assemblies, which it
      # expects at %AppData%\XIVLauncher\addon\Hooks\dev (normally populated
      # by XIVLauncher after launching the game once). CI has no game
      # install, so fetch the same assemblies XIVLauncher would install,
      # straight from Dalamud's distribution CDN.
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud-latest.zip
          Expand-Archive -Force -Path dalamud-latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore
        run: dotnet restore MooglRadio/MooglRadio.csproj

      - name: Build (Release)
        run: dotnet build MooglRadio/MooglRadio.csproj -c Release --no-restore -v:normal

      - name: Locate packaged zip
        id: locate_zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path MooglRadio/bin/Release -Recurse -Filter "latest.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Error "latest.zip not found under MooglRadio/bin/Release — check DalamudPackager output path."
            exit 1
          }
          $dest = Join-Path $zip.Directory.FullName "MooglRadio.zip"
          Copy-Item -Path $zip.FullName -Destination $dest -Force
          echo "zip_path=$dest" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_zip.outputs.zip_path }}
          generate_release_notes: true
