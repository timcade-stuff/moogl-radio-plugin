name: Security

# Runs the security checks documented in SECURITY_AUDIT.md on every push and
# PR (unlike release.yml, which only runs on tag pushes): dependency
# vulnerability audit, the SecurityCodeScan Roslyn analyzer (via the normal
# build), and a gitleaks secret scan. All third-party actions are pinned to
# commit SHAs (see SECURITY_AUDIT.md, "CI supply chain" finding).

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-and-analyzer-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Same as release.yml: Dalamud.NET.Sdk needs Dalamud's own assemblies
      # on disk to build against; CI has no game install, so fetch them from
      # Dalamud's distribution CDN.
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud-latest.zip
          Expand-Archive -Force -Path dalamud-latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore (locked mode)
        run: dotnet restore MooglRadio/MooglRadio.csproj --locked-mode

      # Surfaces both the built-in NuGetAudit warnings and the
      # SecurityCodeScan analyzer's diagnostics in the build log.
      - name: Build
        run: dotnet build MooglRadio/MooglRadio.csproj -c Release --no-restore

      - name: List vulnerable packages
        run: dotnet list MooglRadio/MooglRadio.csproj package --vulnerable --include-transitive

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit

      # Not the gitleaks/gitleaks-action wrapper: as of its v3 "breaking
      # update", that wrapper requires a paid GITLEAKS_LICENSE for repos
      # under a GitHub organization (this repo is under one), even though
      # the underlying gitleaks CLI itself is free and MIT-licensed.
      # Downloading and running the CLI release directly avoids that gate
      # and avoids taking on the wrapper as a dependency. Checksum below is
      # from gitleaks_8.30.1_checksums.txt in the linked release, pinning
      # against a tampered download the same way the rest of this repo's
      # supply chain is pinned (see SECURITY_AUDIT.md, F6/F9).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . -v
